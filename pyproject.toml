[project]
name = "stackdoctor"
version = "0.1.0"
description = "Read-only MCP server that diagnoses a Python backend stack (Postgres, Celery, Redis, logs) with cross-system correlation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "celery", "postgres", "redis", "diagnostics", "observability"]
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.3",
    "sqlglot>=25",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/lepri89/stackdoctor"
Issues = "https://github.com/lepri89/stackdoctor/issues"

[project.scripts]
stackdoctor = "stackdoctor.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stackdoctor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
